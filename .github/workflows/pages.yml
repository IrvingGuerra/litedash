# GitHub Pages solo redirige al sitio de verdad (litedash.dev, Firebase Hosting; ver firebase.json).
name: Pages

on:
  push:
    branches: [main]
    paths: ["redireccion/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redireccion
      - id: deployment
        uses: actions/deploy-pages@v4
