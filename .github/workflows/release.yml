name: Lanzamiento

# Al empujar una etiqueta vX.Y.Z[-beta.N|-rc.N].
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Revisar que la etiqueta coincida con version.properties
        run: |
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con VERSION_NAME=$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.LITEDASH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto LITEDASH_KEYSTORE_BASE64: los APK de GitHub siempre van firmados con la llave real"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/litedash.jks"
          echo "LITEDASH_STORE_FILE=$RUNNER_TEMP/litedash.jks" >> "$GITHUB_ENV"

      - name: Compilar AAB y APK
        env:
          LITEDASH_STORE_PASSWORD: ${{ secrets.LITEDASH_STORE_PASSWORD }}
          LITEDASH_KEY_ALIAS: ${{ secrets.LITEDASH_KEY_ALIAS }}
          LITEDASH_KEY_PASSWORD: ${{ secrets.LITEDASH_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease bundlePlayRelease --console=plain

      - name: Armar archivos y notas
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/app-github-release.apk "out/litedash-$VERSION.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          # Notas = la sección de esta versión en CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Versión $VERSION." > notes.md

      - name: Crear el Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          case "$VERSION" in *-beta.*|*-rc.*) extra="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --title "LiteDash $VERSION" --notes-file notes.md $extra

      - name: AAB para Google Play (Irving lo sube)
        uses: actions/upload-artifact@v4
        with:
          name: litedash-${{ env.VERSION }}-play-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
