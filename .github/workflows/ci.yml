name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El id "compilar" es el check que exige la protección de main: no renombrarlo.
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar, lint y pruebas
        run: ./gradlew assemblePlayDebug assembleGithubRelease :benchmark:assembleBenchmark lint test --console=plain

      - name: Presupuesto de tamaño
        run: |
          apk=app/build/outputs/apk/github/release/app-github-release.apk
          size=$(stat -c%s "$apk")
          echo "APK github release: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt $((8 * 1024 * 1024)) ]; then
            echo "::error::El APK pesa $((size / 1024)) KB y el presupuesto es 8 MB"
            exit 1
          fi

      - name: Reportes de lint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint
          path: app/build/reports/lint-results-*.html
